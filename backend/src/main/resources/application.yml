server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ner-shield-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nershield}
    username: ${DB_USERNAME:nershield}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: nershield-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

nershield:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 1h

  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: 5s
    read-timeout: 30s

  security:
    jwt:
      issuer: ${JWT_ISSUER:ner-shield}
      # No default on purpose: must be supplied once JWT authentication is implemented.
      secret: ${JWT_SECRET:}
      access-token-ttl: 15m
      refresh-token-ttl: 7d

logging:
  level:
    com.nershield: ${LOG_LEVEL_APP:INFO}
