# Test profile: boots the full application context without a PostgreSQL/PostGIS server.
# An in-memory H2 database (H2GIS-compatible spatial mode, via hibernate-spatial's
# H2GisDialectContributor) stands in for the datasource. Flyway stays disabled because the
# versioned migrations are PostGIS-specific SQL; instead Hibernate generates a matching
# schema straight from the JPA entities (create-drop, fresh per test context) so
# JPA-backed sources have real tables to read/write in tests. Tests that exercise real
# PostGIS-specific SQL (not just JTS geometry types) need a real PostgreSQL instance and
# should declare it explicitly.
spring:
  datasource:
    url: jdbc:h2:mem:nershield;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

nershield:
  cors:
    allowed-origins: http://localhost:3000
  ai:
    base-url: http://localhost:8000
  security:
    jwt:
      issuer: ner-shield-test
