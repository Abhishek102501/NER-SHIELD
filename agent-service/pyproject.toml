[project]
name = "nershield-agent-service"
version = "0.1.0"
description = "NER-SHIELD AI Disaster Response Agent — LLM orchestration, tool calling, and RAG. Kept separate from ml-service (the trained-model service) so LLM/agent dependencies never entangle with the rainfall/landslide model runtime."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.40",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
